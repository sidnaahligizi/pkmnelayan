<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">

  <meta name="keywords" content="Puskesmas Nelayan, Layanan Kesehatan, Puskesmas, Berobat, Informasi Kesehatan">
  <meta name="author" content="Puskesmas Nelayan">
  <meta name="robots" content="index, follow">

  <!-- Open Graph / WhatsApp & Facebook Preview -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://puskesmasnelayan.web.id/">
  <meta property="og:title" content="Puskesmas Nelayan - Portal Layanan Kesehatan">
  <meta property="og:description" content="Akses cepat informasi dan layanan kesehatan terpadu di Puskesmas Nelayan.">
  <meta property="og:image" content="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' fill='%230d9488'><rect width='100' height='100' rx='20' fill='%230d9488'/><path d='M42 25h16v17h17v16H58v17H42V58H25V42h17V25z' fill='white'/></svg>">

  <!-- Twitter Card -->
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:url" content="https://puskesmasnelayan.web.id/">
  <meta property="twitter:title" content="Puskesmas Nelayan - Portal Layanan Kesehatan">
  <meta property="twitter:description" content="Akses cepat informasi dan layanan kesehatan terpadu di Puskesmas Nelayan.">

  <!-- Mobile Theme & PWA Settings -->
  <meta name="theme-color" content="#0d9488">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Puskesmas Nelayan">

  <!-- Favicon Vector SVG Medical Cross -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%230d9488'><path d='M19 3H5c-1.1 0-1.99.9-1.99 2L3 19c0 1.1.89 2 1.99 2H19c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z'/></svg>">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%230d9488'><path d='M19 3H5c-1.1 0-1.99.9-1.99 2L3 19c0 1.1.89 2 1.99 2H19c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z'/></svg>">

  <style>
    /* Reset & Base Layout Styling */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh; /* Dynamic Viewport Unit untuk HP modern */
      overflow: hidden;
      background-color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    .app-container {
      position: relative;
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
    }

    /* Animasi Overlay Loading */
    .loading-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99;
      transition: opacity 0.4s ease, visibility 0.4s ease;
      padding: 24px;
      text-align: center;
    }

    .loading-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .pulse-logo {
      width: 64px;
      height: 64px;
      margin-bottom: 20px;
      color: #0d9488;
      animation: pulse 1.6s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(0.95);
        opacity: 0.8;
      }
      50% {
        transform: scale(1.08);
        opacity: 1;
      }
    }

    .loading-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 6px;
      letter-spacing: -0.01em;
    }

    .loading-subtitle {
      font-size: 0.9rem;
      color: #64748b;
    }

    /* iFrame Wrapper Fullscreen */
    .app-iframe {
      width: 100%;
      height: 100%;
      border: none;
      margin: 0;
      padding: 0;
      display: block;
      background-color: #ffffff;
      -webkit-overflow-scrolling: touch;
    }

    /* Fallback Direct Link Button */
    .fallback-btn {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #0d9488;
      color: #ffffff;
      padding: 10px 20px;
      border-radius: 30px;
      font-size: 0.85rem;
      font-weight: 600;
      text-decoration: none;
      box-shadow: 0 4px 14px rgba(13, 148, 136, 0.35);
      z-index: 10;
      display: none;
      transition: background 0.2s;
    }

    .fallback-btn:hover {
      background: #0f766e;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Screen Loader -->
    <div id="loadingOverlay" class="loading-overlay">
      <svg class="pulse-logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
      </svg>
      <div class="loading-title">Puskesmas Nelayan</div>
      <div class="loading-subtitle">Memuat aplikasi kesehatan...</div>
    </div>

    <!-- Responsive iFrame Embed -->
    <iframe 
      id="mainFrame"
      class="app-iframe" 
      src="https://puskesmas-web-f45l.vercel.app" 
      title="Aplikasi Puskesmas Nelayan"
      allow="geolocation; microphone; camera; display-capture; autoplay; clipboard-write; encrypted-media; web-share"
      sandbox="allow-forms allow-modals allow-orientation-lock allow-pointer-lock allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts allow-top-navigation-by-user-activation"
      loading="eager">
    </iframe>

    <a href="https://puskesmas-web-f45l.vercel.app" id="fallbackLink" class="fallback-btn" target="_blank" rel="noopener noreferrer">
      Buka Aplikasi Langsung &rarr;
    </a>
  </div>

  <!-- JavaScript Fallback Layer -->
  <noscript>
    <div style="position: fixed; inset: 0; background: #ffffff; padding: 40px 20px; text-align: center; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center;">
      <h2 style="color: #0f172a; margin-bottom: 10px;">JavaScript Diperlukan</h2>
      <p style="color: #64748b; margin-bottom: 20px; max-width: 400px;">Mohon aktifkan JavaScript di browser Anda untuk mengakses portal layanan Puskesmas Nelayan.</p>
      <a href="https://puskesmas-web-f45l.vercel.app" style="background: #0d9488; color: #ffffff; padding: 12px 24px; border-radius: 8px; text-decoration: none; font-weight: 600;">Akses Aplikasi Langsung</a>
    </div>
  </noscript>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const iframe = document.getElementById('mainFrame');
      const loadingOverlay = document.getElementById('loadingOverlay');
      const fallbackLink = document.getElementById('fallbackLink');

      // Sembunyikan loading overlay saat iframe selesai dimuat
      iframe.addEventListener('load', function() {
        loadingOverlay.classList.add('hidden');
      });

      // Timeout fallback (4 detik)
      setTimeout(function() {
        if (!loadingOverlay.classList.contains('hidden')) {
          loadingOverlay.classList.add('hidden');
        }
      }, 4000);

      // Tampilkan tombol cadangan jika koneksi lambat
      setTimeout(function() {
        fallbackLink.style.display = 'inline-block';
      }, 7000);
    });
  </script>
</body>
</html>
