<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem MCU - Puskesmas Nelayan</title>

    <!-- Favicon (Logo Anda yang akan muncul di tab browser) -->
    <link rel="icon" href="https://lh3.googleusercontent.com/d/1lmHDe6r7V4bp3xdRNqfQyuzqREGYe29o" type="image/png">

    <style>
        /* Menghilangkan margin bawaan agar tampilan embed menyatu dengan layar */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Mencegah munculnya scrollbar ganda */
            background-color: #f0f2f5; /* Warna background disamakan dengan aplikasi */
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        /* Styling iframe agar menutupi seluruh wadah secara responsif */
        .iframe-container {
            width: 100%;
            height: 100vh; /* 100% tinggi layar */
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <!-- Embed Aplikasi Vercel Anda di sini -->
    <iframe 
        src="https://mcu-tan.vercel.app/" 
        class="iframe-container" 
        title="Aplikasi MCU Puskesmas Nelayan"
        allowfullscreen>
    </iframe>

</body>
</html>
